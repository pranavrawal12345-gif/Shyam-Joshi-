    // App Initialization & Interaction Handlers
    document.addEventListener('DOMContentLoaded', () => {
      renderApp();
      if (window.lucide) window.lucide.createIcons();

      // Theme toggle
      const savedTheme = localStorage.getItem('pranav_portfolio_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);

      function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('pranav_portfolio_theme', next);
      }

      const themeBtn = document.getElementById('theme-toggle-btn');
      const mobileThemeBtn = document.getElementById('mobile-theme-btn');
      if (themeBtn) themeBtn.addEventListener('click', toggleTheme);
      if (mobileThemeBtn) mobileThemeBtn.addEventListener('click', toggleTheme);

      // Mobile Menu
      const menuBtn = document.getElementById('mobile-menu-btn');
      const drawer = document.getElementById('mobile-drawer');
      if (menuBtn && drawer) {
        menuBtn.addEventListener('click', () => drawer.classList.toggle('hidden'));
        drawer.querySelectorAll('a').forEach(l => l.addEventListener('click', () => drawer.classList.add('hidden')));
      }

      // Modals
      const modalContainer = document.getElementById('modal-container');
      const modalContent = document.getElementById('modal-content');

      function openModal(html) {
        modalContent.innerHTML = html;
        modalContainer.classList.remove('hidden');
        modalContainer.classList.add('flex');
        document.body.style.overflow = 'hidden';
        if (window.lucide) window.lucide.createIcons();
      }

      function closeModal() {
        modalContainer.classList.add('hidden');
        modalContainer.classList.remove('flex');
        document.body.style.overflow = '';
      }

      // CV Buttons
      ['nav-cv-btn', 'mobile-cv-btn', 'hero-cv-btn', 'contact-cv-btn'].forEach(id => {
        const btn = document.getElementById(id);
        if (btn) btn.addEventListener('click', (e) => {
          e.preventDefault();
          openModal(getCVModalHtml());
        });
      });

      // Featured Study Modal
      ['open-featured-modal-btn', 'open-featured-modal-btn-2'].forEach(id => {
        const btn = document.getElementById(id);
        if (btn) btn.addEventListener('click', () => openModal(getFeaturedCaseStudyModalHtml(portfolioData.signatureCaseStudy)));
      });

      // Project Cards Modal Trigger
      document.getElementById('projects-container').addEventListener('click', (e) => {
        const card = e.target.closest('.project-card');
        if (!card) return;
        const project = portfolioData.projects.find(p => p.id === card.dataset.projectId);
        if (project) openModal(getProjectModalHtml(project));
      });

      // Modal Close Handlers
      modalContainer.addEventListener('click', (e) => {
        if (e.target === modalContainer || e.target.closest('#close-modal-btn') || e.target.closest('#close-modal-footer-btn')) {
          closeModal();
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !modalContainer.classList.contains('hidden')) closeModal();
      });

      // Project Filtering
      const filterContainer = document.getElementById('project-filters');
      if (filterContainer) {
        filterContainer.addEventListener('click', (e) => {
          const btn = e.target.closest('.project-filter-btn');
          if (!btn) return;
          const category = btn.dataset.category;
          const catLower = category.toLowerCase();

          document.querySelectorAll('.project-filter-btn').forEach(b => {
            b.classList.remove('bg-teal-500', 'text-slate-950', 'font-bold', 'active', 'shadow-md', 'shadow-teal-500/20');
            b.classList.add('bg-slate-900/60', 'text-slate-300');
          });

          btn.classList.remove('bg-slate-900/60', 'text-slate-300');
          btn.classList.add('bg-teal-500', 'text-slate-950', 'font-bold', 'active', 'shadow-md', 'shadow-teal-500/20');

          const filtered = category === 'All' 
            ? portfolioData.projects 
            : portfolioData.projects.filter(p => {
                if (p.category.toLowerCase() === catLower) return true;
                if (p.tags.some(t => t.toLowerCase().includes(catLower) || catLower.includes(t.toLowerCase()))) return true;
                if (catLower === 'branding' && p.tags.some(t => t.toLowerCase().includes('brand'))) return true;
                if (catLower === 'marketing' && (p.category.toLowerCase().includes('market') || p.tags.some(t => t.toLowerCase().includes('market')))) return true;
                return false;
              });

          document.getElementById('projects-container').innerHTML = filtered.map(p => renderProjectCardHtml(p)).join('');
          document.getElementById('project-count').textContent = filtered.length;
          if (window.lucide) window.lucide.createIcons();
        });
      }

      // Clipboard Copy
      document.addEventListener('click', (e) => {
        const copyBtn = e.target.closest('.copy-btn');
        if (!copyBtn) return;
        const textToCopy = copyBtn.dataset.copy;
        if (textToCopy) {
          navigator.clipboard.writeText(textToCopy).then(() => {
            const originalHTML = copyBtn.innerHTML;
            copyBtn.innerHTML = `<span class="text-[10px] font-mono-code text-teal-400 font-bold">Copied!</span>`;
            setTimeout(() => {
              copyBtn.innerHTML = originalHTML;
              if (window.lucide) window.lucide.createIcons();
            }, 2000);
          });
        }
      });

      // Contact Form Email Composer
      const contactForm = document.getElementById('contact-form');
      if (contactForm) {
        contactForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const name = document.getElementById('form-name').value;
          const email = document.getElementById('form-email').value;
          const topic = document.getElementById('form-topic').value;
          const message = document.getElementById('form-message').value;
          window.location.href = `mailto:${portfolioData.personal.email}?subject=${encodeURIComponent(`[${topic}] from ${name}`)}&body=${encodeURIComponent(`Name: ${name}\nEmail: ${email}\nTopic: ${topic}\n\nMessage:\n${message}`)}`;
          alert(`Thank you, ${name}! Your email client is opening with your pre-filled inquiry for Pranav.`);
        });
      }

      // Strategy Engine Nodes
      const nodes = document.querySelectorAll('.strategy-node');
      const outputText = document.getElementById('engine-output-text');
      const stageOutputs = {
        "1": "Active stage: <strong>Primary Fieldwork</strong> across 66 auto body workshops in Mumbai.",
        "2": "Active stage: <strong>Customer Needs & Barriers</strong> — Identified colour accuracy & maintenance friction.",
        "3": "Active stage: <strong>Brand & GTM Architecture</strong> — Differentiated value positioning and channel roadmaps.",
        "4": "Active stage: <strong>Commercial Execution</strong> — Sustainable revenue models & measurable marketing impact."
      };

      nodes.forEach(node => {
        node.addEventListener('click', () => {
          nodes.forEach(n => {
            n.classList.remove('active', 'border-teal-500/50', 'bg-teal-950/30');
            n.classList.add('border-slate-800', 'bg-slate-900/40');
          });
          node.classList.add('active', 'border-teal-500/50', 'bg-teal-950/30');
          node.classList.remove('border-slate-800', 'bg-slate-900/40');
          const stage = node.dataset.stage;
          if (outputText && stageOutputs[stage]) outputText.innerHTML = stageOutputs[stage];
        });
      });

      // Number Counter
      const counterEl = document.getElementById('counter-shops');
      if (counterEl) {
        let started = false;
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting && !started) {
              started = true;
              let current = 0;
              const target = 66;
              const stepTime = Math.abs(Math.floor(1200 / target));
              const timer = setInterval(() => {
                current += 1;
                counterEl.textContent = current;
                if (current >= target) clearInterval(timer);
              }, stepTime);
            }
          });
        }, { threshold: 0.5 });
        observer.observe(counterEl);
      }
    });
  </script>
</body>
